# Own work (CC BY-SA 4.0, as part of the en pack's derived lexicon).
# Everyday survival words that NGSL ranks above 1000 or omits, because NGSL counts
# frequency in a general corpus, not what beginners need. The list is grouped by topic
# and written by the project; it is not copied from EVP, Oxford 3000 or CEFR-J.
