[project]
name = "yt-factory"
version = "0.1.0"
description = "Language-learning video factory: contracts, language packs, level gates and agents."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.13.0",
    "pydantic>=2.14.0",
    "pyyaml>=6.0",
    "spacy>=3.8.0,<3.9",
    "en-core-web-sm",
    "typer>=0.27.0",
    "wn>=1.1.1",
]

[project.scripts]
factory = "factory.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory", "packs"]

[tool.pytest.ini_options]
testpaths = ["tests", "packs"]
