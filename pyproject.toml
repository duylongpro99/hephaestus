[project]
name = "yt-factory"
version = "0.1.0"
description = "Language-learning video factory: contracts, language packs, level gates and agents."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.13.0",
    "pydantic>=2.14.0",
    "pyyaml>=6.0",
    "spacy>=3.8.0,<3.9",
    "en-core-web-sm",
    "typer>=0.27.0",
    "wn>=1.1.1",
    "openai>=3.28.0",
    "psycopg[binary]>=3.2",
    "pillow>=11",
]

[project.scripts]
factory = "factory.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.1",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory", "packs"]

[tool.pytest.ini_options]
testpaths = ["tests", "packs"]
markers = [
    "db: needs Postgres at $DATABASE_URL; skipped when it is unset",
    "e2e: runs a whole episode through the orchestrator (needs Postgres and FFmpeg)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
