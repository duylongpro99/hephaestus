# LLM routing: which provider and model serves each factory role (docs/decisions/0002-per-role-llm-providers.md).
#
# Secrets never live here: each provider names the environment variable that holds its key.
# Changing a role's provider, model or params changes that station's station_version, so stored
# artifacts from the old setting are never reused.

providers:
  deepseek:
    type: openai_compatible
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
  qwen:
    type: openai_compatible
    # International (Singapore) endpoint. Accounts in mainland China use
    # https://dashscope.aliyuncs.com/compatible-mode/v1 instead.
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
  anthropic:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY

# USD per million tokens. A model without an entry is still run; its cost is recorded as unpriced.
prices:
  deepseek:
    # DeepSeek peak-hour prices, checked 2026-10-11 at api-docs.deepseek.com/quick_start/pricing.
    # Off-peak is half. Recording peak keeps the ledger conservative.
    deepseek-v4-pro: {input: 1.32, cached_input: 0.044, output: 3.96}
    deepseek-flash: {input: 0.30, cached_input: 0.006, output: 1.20}
  qwen: {}  # fill in from the Model Studio pricing page; third-party listings disagree
  anthropic:
    claude-opus-5-5: {input: 4.00, cached_input: 0.20, cache_write: 5.00, output: 20.00}
    claude-opus-4-8: {input: 5.00, cached_input: 0.50, cache_write: 6.25, output: 25.00}

# One entry per factory role. `params` are passed to the provider's request as-is
# (for openai_compatible) or read by the provider (anthropic: effort).
roles:
  a2_scriptwriter:
    provider: deepseek
    model: deepseek-v4-pro
    max_tokens: 32000
    params: {reasoning_effort: high, extra_body: {thinking: {type: enabled}}}
  a3_level_editor:
    provider: deepseek
    model: deepseek-v4-pro
    max_tokens: 16000
    params: {reasoning_effort: high, extra_body: {thinking: {type: enabled}}}
  # Both reviewers use a different vendor from the writer, so the panel never judges
  # its own model family's output (ADR 0001, decision 3).
  review_examiner:
    provider: qwen
    model: qwen3-max
    max_tokens: 16000
    params: {}
  review_learner:
    provider: qwen
    model: qwen3-max
    max_tokens: 16000
    params: {}
