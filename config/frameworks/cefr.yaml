# Level Framework: CEFR, the internal scale (architecture §4.0).
# Values come from research.md §2.1. [P] marks a planning estimate to calibrate.
framework: cefr
version: 1
levels: [PreA1, A1, A2, B1, B2, C1, C2]
bands:
  A1:
    coverage_min: 0.95            # share of content tokens at or below the level
    new_word_max: 0.05            # distinct new lemmas / distinct content lemmas
    target_repetition_min: 5      # occurrences of each target word per episode
    sentence_length: [6, 8]       # mean words per sentence
    long_sentence_share_max: 0.10 # share of sentences longer than the band maximum
    sentence_length_gate: band    # band: mean must sit inside the band; ceiling: only the maximum is gated
    rate: {unit: wpm, min: 80, max: 100}
    pause_ms: [2000, 4000]
    grammar:
      - present simple of be and have
      - present simple
      - present continuous for now
      - can and can't for ability
      - there is and there are
      - imperatives
      - possessive adjectives and possessive 's
      - this, that, these, those
      - a, an, the, some, any
      - prepositions of place and time
      - and, but, or, because
  A2:
    coverage_min: 0.95
    new_word_max: 0.05
    target_repetition_min: 5
    sentence_length: [8, 12]      # [P] interpolated between A1 (6-8) and B1 (12-15)
    long_sentence_share_max: 0.10
    sentence_length_gate: ceiling # natural dialogue averages ~7 words; only long sentences are gated (user decision 2026-10-12)
    rate: {unit: wpm, min: 100, max: 120}
    pause_ms: [1500, 3000]
    grammar:
      - everything allowed at A1
      - past simple, regular and common irregular verbs
      - past continuous for background actions
      - going to for plans
      - will for offers and quick decisions
      - comparatives and superlatives
      - present perfect with ever, never, just, already
      - should and must for advice and rules
      - have to and don't have to
      - would like for polite requests
      - adverbs of frequency
      - countable and uncountable nouns with much, many, a lot of
      - when and before/after clauses
      - so for results
  B1:
    coverage_min: 0.95
    new_word_max: 0.05
    target_repetition_min: 5
    sentence_length: [12, 15]
    long_sentence_share_max: 0.10
    sentence_length_gate: band    # band: mean must sit inside the band; ceiling: only the maximum is gated
    rate: {unit: wpm, min: 120, max: 140}
    pause_ms: [1000, 2000]
    grammar: []                   # not yet defined for B1
