# Channel Bible for the EN A2 script spike (docs/decisions/0001-first-slice-and-spike-scope.md).
channel: en-podcast-spike
version: 1
target: {pack: en, framework: cefr, levels: [A2]}
audience: adult
support_languages: [en, vi]
persona:
  name: Anna
  bio: An English teacher from Manchester who has lived in Hanoi for six years. She loves street food and cycling.
  speaking_style: Warm, calm and clear. Short sentences, everyday words, gentle humour. Repeats key words naturally.
  catchphrases: ["Let's listen again.", "Easy, right?"]
cast:
  - {id: anna, role: host, voice: en-gb-female-1, description: The teacher and host. She explains the words and the grammar.}
  - {id: ben, role: guest, voice: en-gb-male-1, description: "Anna's friend, a cheerful office worker who tells everyday stories."}
# The spike runs 10-15 second micro_dialogue clips (user decision 2026-10-12).
formats: [micro_dialogue, slow_dialogue_explain_replay]
# Values here override the framework band and the audience overrides for this channel.
band_overrides:
  target_repetition_min: 1   # a 10-15 second clip has room for one use of its target word
  # The target word alone is 1 of 10-19 distinct lemmas (5-10%) in a clip; a second new word
  # takes a clip under 20 lemmas past 10%.
  new_word_max: 0.10
